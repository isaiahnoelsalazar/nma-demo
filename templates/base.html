<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}National Music Academy — Online Piano Lessons in Australia{% endblock %}</title>
<meta name="description" content="{% block description %}Learn piano online with Australia’s finest instructors. Live one-on-one lessons, AMEB & ABRSM curriculum, flexible scheduling. First lesson free. No lock-in contracts.{% endblock %}">
<meta name="author" content="National Music Academy">
<meta property="og:title" content="National Music Academy — Online Piano Lessons in Australia">
<meta property="og:type" content="website">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{background:'var(--background)',card:'var(--card)',foreground:'var(--foreground)','muted-foreground':'var(--muted)',ring:'var(--gold)'},fontFamily:{serif:['"Playfair Display"','Georgia','serif']}}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
{% with msgs = get_flashed_messages(with_categories=true) %}{% if msgs %}
<div class="fixed inset-x-0 top-24 z-[100] mx-auto flex max-w-md flex-col gap-2 px-4">
{% for cat, m in msgs %}<div class="rounded-lg bg-[var(--maroon-deep)] px-4 py-3 text-sm text-[var(--cream)] shadow-elegant" role="status">{{ m }}</div>{% endfor %}</div>
{% endif %}{% endwith %}
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
